[project]
name = "db-autoconformite-mcp"
version = "0.1.0"
description = "Automated compliance of a database fleet (PostgreSQL, Oracle) for AI agents, through an MCP server"
readme = "README.md"
authors = [
    { name = "Hadi Jamal Ahmad", email = "hadi.jamalahmad@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "oracledb>=26.1.0",
    "psycopg[binary]>=3.3.9",
    "pyyaml>=6.0.3",
]

[project.scripts]
db-autoconformite-mcp = "db_autoconformite_mcp.server:main"
fleetctl = "db_autoconformite_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local fleet (docker compose -f fleet/compose.yaml up -d)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
