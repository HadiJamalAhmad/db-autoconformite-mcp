# Intégration continue et auto-conformité.
#
#   test      lint (ruff) + tests unitaires et protocole MCP, sans base de données
#   security  scan de secrets sur tout l'historique (gitleaks) + audit des dépendances (pip-audit)
#   fleet     le parc PostgreSQL réel (docker compose) : tests d'intégration, rapport de
#             conformité publié, et preuve que le contrôle BLOQUE sur les dérives volontaires
#   oracle    Oracle Database Free : le collecteur Oracle et les règles contre une vraie base
#
# Planifié chaque nuit : la conformité est vérifiée même quand personne ne pousse de code.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv export --frozen --no-hashes --no-emit-project -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --strict

  fleet:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Random credentials for this run only
        run: |
          for name in POSTGRES_PASSWORD AUTOCONF_PG_PASSWORD; do
            value=$(openssl rand -hex 16)
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
      - run: docker compose -f fleet/compose.yaml up -d --wait
      - run: uv run python fleet/seed_backups.py
      - run: uv run pytest -q -m integration
      - name: Compliance report
        run: |
          uv run fleetctl check --format markdown > report.md || true
          uv run fleetctl correlate > correlation.txt || true
          { echo "## Rapport de conformité"; cat report.md; echo; echo '```';
            cat correlation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The compliance gate blocks the deliberate drifts
        run: |
          if uv run fleetctl check --fail-on high > /dev/null; then
            echo "::error::the gate let a drifted fleet through"; exit 1
          fi
          echo "gate blocked as expected"
      - uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: |
            report.md
            correlation.txt

  ansible:
    # Detect -> fix -> verify, on this run's throwaway fleet only:
    #   1. the standard-config playbook in --check mode on the real fleet;
    #   2. cross-check: Ansible's would-be changes must match fleetctl's failing rules;
    #   3. apply it for real on pg-prod-02, restart, and check it is compliant again.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Random credentials for this run only
        run: |
          for name in POSTGRES_PASSWORD AUTOCONF_PG_PASSWORD; do
            value=$(openssl rand -hex 16)
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
      - run: docker compose -f fleet/compose.yaml up -d --wait
      - run: uv run python fleet/seed_backups.py
      - name: Ansible and the PostgreSQL collection (pinned)
        run: |
          uv tool install ansible-core==2.20.11 --with psycopg2-binary==2.9.13 --python 3.12
          ansible-galaxy collection install community.postgresql:==5.1.0
          echo "ANSIBLE_PY=$(uv tool dir)/ansible-core/bin/python" >> "$GITHUB_ENV"
      - run: uv run fleetctl ansible-export
      - name: 1. Playbook in check mode
        run: |
          ANSIBLE_STDOUT_CALLBACK=ansible.builtin.json ansible-playbook \
            -i ansible/generated/inventory.yml ansible/standard-config.yml --check \
            -e ansible_python_interpreter="$ANSIBLE_PY" > ansible-check.json
      - name: 2. Cross-check Ansible against fleetctl
        run: |
          uv run fleetctl check --format json > fleet-before.json || true
          uv run python -m db_autoconformite_mcp.ansible_crosscheck ansible-check.json fleet-before.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 3. Apply on pg-prod-02 (throwaway CI fleet), restart, verify
        run: |
          ansible-playbook -i ansible/generated/inventory.yml ansible/standard-config.yml \
            --limit pg-prod-02 -e ansible_python_interpreter="$ANSIBLE_PY"
          docker compose -f fleet/compose.yaml restart pg-prod-02
          docker compose -f fleet/compose.yaml up -d --wait
          uv run fleetctl check --instance pg-prod-02 --format json > fleet-after.json || true
          uv run python - <<'EOF'
          import json
          findings = json.load(open("fleet-after.json"))["pg-prod-02"]
          failing = sorted(f["rule_id"] for f in findings if f["status"] != "pass")
          print("pg-prod-02 after remediation, still failing:", failing)
          assert failing == ["R05"], failing  # only the backup, which is not a setting
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ansible-reports
          path: |
            ansible-check.json
            fleet-before.json
            fleet-after.json

  oracle:
    needs: test
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23.9-slim-faststart
        env:
          # Throwaway container, reachable only from this runner, destroyed after the job.
          ORACLE_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s
          --health-retries 30
    env:
      ORACLE_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Monitoring account and deliberate drift
        run: |
          value=$(openssl rand -hex 16)
          echo "::add-mask::$value"
          printf 'AUTOCONF_ORA_PASSWORD=%s\n' "$value" >> "$GITHUB_ENV"
          AUTOCONF_ORA_PASSWORD="$value" uv run python fleet/oracle/setup_ci.py
      - run: uv run pytest -q -m integration -k oracle
      - name: Oracle compliance report
        env:
          AUTOCONF_INVENTORY: fleet/oracle/inventory.yaml
        run: |
          uv run fleetctl check --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
          uv run fleetctl plan ora-ci-01
